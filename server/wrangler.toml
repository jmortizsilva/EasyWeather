name = "easyweather-alerts"
main = "src/index.js"
compatibility_date = "2025-01-01"

# La base de datos donde se guardan los dispositivos y sus umbrales.
# El database_id lo rellenas tras crear la base de datos (ver README.md, paso 5).
[[d1_databases]]
binding = "DB"
database_name = "easyweather-alerts"
database_id = "0e066075-34ff-4365-a174-18b516c923c8"

# Cron DESACTIVADO: el servicio de avisos se movio a un VPS propio (api.jmortiz.es).
# IMPORTANTE: hay que declarar el array VACIO explicito. Comentar el bloque NO basta: wrangler, si
# no se declaran crons, deja los existentes tal cual (por eso una primera vez el cron siguio vivo y
# duplicaba avisos). `crons = []` borra todos los triggers al desplegar.
[triggers]
crons = []
