name = "easyweather-alerts"
main = "src/index.js"
compatibility_date = "2025-01-01"

# La base de datos donde se guardan los dispositivos y sus umbrales.
# El database_id lo rellenas tras crear la base de datos (ver README.md, paso 5).
[[d1_databases]]
binding = "DB"
database_name = "easyweather-alerts"
database_id = "0e066075-34ff-4365-a174-18b516c923c8"

# Cron DESACTIVADO el 2026-08-06: el servicio de avisos se movio a un VPS propio (api.jmortiz.es).
# Se dejan los endpoints vivos unos dias como red de seguridad, pero ya no se envian avisos desde
# aqui (para no duplicar con el servidor nuevo). Para reactivar, descomentar estas dos lineas.
# [triggers]
# crons = ["*/20 * * * *"]
